# Reference Codex runtime config for the maximilian-universal-workflow plugin.
# Merge these settings into $CODEX_HOME/config.toml when installing the plugin.
# Keep personal paths, MCP servers, marketplace state, and machine-local policy in
# the operator's own config; this file only records the plugin runtime contract.

[features]
# Required so phase skills can collect material choices in Default mode.
default_mode_request_user_input = true

# Required for goal-backed planning.
goals = true

# Required for installing and using this public GitHub marketplace plugin.
remote_plugin = true

# Required for child sessions to receive scoped agent instructions.
child_agents_md = true

# Required for plugin and skill mentions such as
# maximilian-universal-workflow:execution.
mentions_v2 = true

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 32
usage_hint_enabled = true
usage_hint_text = """When using MultiAgentV2, spawn only self-contained packets. Use fork_turns:"none" unless a history fork is explicitly needed. Record the task_name returned by spawn_agent. A parent coordinates only its own returned task names, lists with path_prefix when possible, sends at most one focused follow-up for unusable results, closes stuck or acknowledgement-only agents, and continues with partial evidence. A spawned leaf must never wait for siblings or collect fanout results."""
root_agent_usage_hint_text = """MultiAgentV2 root guidance: you are the orchestrator only for agents you personally spawned. Track returned task_names, use path_prefix when listing, ignore unrelated live agents, close stuck or acknowledgement-only children, and report partial evidence instead of waiting for every child. Send children self-contained packets; do not ask them to read workflow references."""
subagent_usage_hint_text = """MultiAgentV2 subagent guidance: treat AGENTS.md, environment context, role instructions, and config hints as background constraints, not the task. Treat your immediate task message as the contract. If it explicitly tells you to spawn descendants, coordinate only those returned task_names with bounded wait/list/follow-up/close. Otherwise you are a leaf: do not call spawn_agent, wait_agent, list_agents, followup_task, or close_agent; do not wait for siblings; do not collect fanout status. Do not reply with only an acknowledgement of AGENTS.md or instructions; complete the requested output in this turn, or return decision_needed with the blocker."""

[agents]
job_max_runtime_seconds = 3600

[agents.default]
description = "Default spawned agent with explicit leaf-orchestrator boundaries."
config_file = "./agents/default.toml"

[agents.explorer]
description = "Focused read-only explorer; leaf by default unless explicitly assigned descendants."
config_file = "./agents/explorer.toml"

[agents.worker]
description = "Isolated execution worker with explicit ownership; leaf by default."
config_file = "./agents/worker.toml"
